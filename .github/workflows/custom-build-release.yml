name: Build & Release Bitwarden Custom APK

on:
  workflow_dispatch:  # 支持页面手动运行
  push:
    tags:
      - 'v*'          # git push tag vxxx 自动触发构建Release

permissions:
  contents: write     # 需要write权限，用来创建Release
  packages: read      # 拉取Bitwarden私有Maven依赖

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK‑21
        uses: actions/setup‑java@v4
        with:
          java‑version: 21
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android‑actions/setup‑android@v4

      # 写入gitHubToken，用于拉取bitwarden私有maven依赖
      - name: Create user.properties
        run: |
          cat > user.properties <<EOF
          gitHubToken=${{ secrets.BW_GITHUB_PAT }}
          localSdk=false
          EOF

      - name: Gradle assembleFdroidDebug
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleFdroidDebug --no‑build‑cache --stacktrace

      - name: Save APK to variable
        id: apk_file
        run: |
          APK=$(ls app/build/outputs/apk/fdroid/debug/*.apk)
          echo "APK=$APK" >> $GITHUB_ENV

      - name: Upload build artifact(workflow artifact)
        uses: actions/upload‑artifact@v4
        with:
          name: bitwarden‑custom‑apk
          path: ${{ env.APK }}

      # ========= 只有tag推送的时候，才生成GitHub Release =========
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action‑gh‑release@v2
        with:
          generate_release_notes: true
          files: ${{ env.APK }}

